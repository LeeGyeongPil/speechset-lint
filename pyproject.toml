[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "speechset-lint"
version = "0.1.0"
description = "Pre-flight lint for speech fine-tuning manifests (Whisper, wav2vec2 CTC, TTS): NeMo JSONL, HF audiofolder, LJSpeech."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeeGyeongPil" }]
keywords = ["speech", "asr", "tts", "whisper", "ctc", "dataset", "lint", "fine-tuning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
tokens = ["tokenizers>=0.15"]

[project.scripts]
speechset-lint = "speechset_lint.cli:main"

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/speechset-lint"
Issues = "https://github.com/LeeGyeongPil/speechset-lint/issues"

[dependency-groups]
dev = ["pytest>=8", "tokenizers>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/speechset_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
